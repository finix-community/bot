[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
eros = { version = "0.7", features = ["tracing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

twilight = "0.17"
twilight-gateway = "0.17"
twilight-http = "0.17"

sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
octocrab = "0.54"
axum = "0.8"
oauth2 = "5"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
